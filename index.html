<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e17">
  <meta name="description" content="An interactive circle of fifths — key signatures, relationships and scales, right on your phone.">
  <title>C05</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>

  <header class="app-header">
    <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
      <g fill="none" stroke="url(#logoGrad)" stroke-linecap="round">
        <circle cx="24" cy="24" r="20" stroke-width="2.4"/>
        <circle cx="24" cy="24" r="11" stroke-width="2"/>
        <circle cx="24" cy="4" r="2.6" fill="url(#logoGrad)" stroke="none"/>
        <circle cx="41.3" cy="14" r="2.6" fill="url(#logoGrad)" stroke="none"/>
        <circle cx="41.3" cy="34" r="2.6" fill="url(#logoGrad)" stroke="none"/>
        <circle cx="24" cy="44" r="2.6" fill="url(#logoGrad)" stroke="none"/>
        <circle cx="6.7" cy="34" r="2.6" fill="url(#logoGrad)" stroke="none"/>
        <circle cx="6.7" cy="14" r="2.6" fill="url(#logoGrad)" stroke="none"/>
      </g>
      <defs>
        <linearGradient id="logoGrad" gradientUnits="userSpaceOnUse" x1="4" y1="4" x2="44" y2="44">
          <stop offset="0" stop-color="#00f0ff"/>
          <stop offset="1" stop-color="#ff2d95"/>
        </linearGradient>
      </defs>
    </svg>
    <h1>C05</h1>
    <p class="tagline">CIRCLE · KEYS · SCALES</p>
  </header>

  <main>
    <section class="card wheel-card">
      <div class="wheel-wrap" id="wheel-wrap"></div>
      <div class="wheel-legend">
        <span><i class="legend-dot tonic"></i>selected key</span>
        <span><i class="legend-dot dominant"></i>dominant (V)</span>
        <span><i class="legend-dot subdominant"></i>subdominant (IV)</span>
      </div>
      <div class="control-row">
        <span class="switch-label">SHOW AS FLATS</span>
        <label class="switch">
          <input type="checkbox" id="enharmonic-toggle">
          <span class="switch-track" aria-hidden="true"></span>
        </label>
      </div>
    </section>

    <section class="card info-card">
      <h2 class="card-title">KEY INFO</h2>
      <div class="key-facts">
        <div class="key-fact wide">
          <span class="key-fact-label">SIGNATURE</span>
          <span class="key-fact-value accent-cyan" id="kf-signature">No sharps or flats</span>
        </div>
        <div class="key-fact">
          <span class="key-fact-label">RELATIVE MINOR</span>
          <span class="key-fact-value" id="kf-relative">A minor</span>
        </div>
        <div class="key-fact">
          <span class="key-fact-label">DOMINANT (V)</span>
          <span class="key-fact-value accent-magenta" id="kf-dominant">G major</span>
        </div>
        <div class="key-fact wide">
          <span class="key-fact-label">SUBDOMINANT (IV)</span>
          <span class="key-fact-value accent-violet" id="kf-subdominant">F major</span>
        </div>
      </div>
    </section>

    <section class="card scale-card">
      <div class="scale-header">
        <label for="mode-select" class="card-title">SCALE</label>
        <select id="mode-select" class="mode-select" aria-label="Scale / mode">
          <option value="ionian">MAJOR SCALE</option>
          <option value="dorian">DORIAN</option>
          <option value="phrygian">PHRYGIAN</option>
          <option value="lydian">LYDIAN</option>
          <option value="mixolydian">MIXOLYDIAN</option>
          <option value="aeolian">MINOR</option>
          <option value="locrian">LOCRIAN</option>
        </select>
      </div>
      <div class="scale-table" id="scale-table" role="list" aria-label="Scale degrees — tap a note to hear it"></div>
      <button id="play-scale-btn" class="btn btn-outline">
        <span class="btn-play-icon" aria-hidden="true"></span>PLAY SCALE
      </button>
    </section>
  </main>

  <footer class="app-footer">runs 100% on your device · works offline</footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
